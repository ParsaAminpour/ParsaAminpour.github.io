<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soft Resolution: A Prediction Market for Subjective Outcomes — Parsa Amini</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: hsl(210, 11.1%, 3.53%);
    color: #ededed;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: #ededed; color: hsl(210,11.1%,3.53%); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: hsl(210,11.1%,3.53%); }
  ::-webkit-scrollbar-thumb { background: #d0c7b8; border-radius: 4px; }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 64px 24px 120px;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #a1a1a8;
    font-weight: 500;
    margin-bottom: 28px;
    transition: color 0.15s;
  }
  .back:hover { color: #ededed; }
  .back svg { width: 14px; height: 14px; }

  .meta {
    font-size: 13px;
    color: #6b6b75;
    margin-bottom: 16px;
    display: flex;
    gap: 12px;
  }
  .meta span::after { content: '·'; margin-left: 12px; }
  .meta span:last-child::after { content: ''; }

  h1 {
    font-size: 36px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.03em;
    color: #ededed;
    margin-bottom: 20px;
  }

  .divider {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.08);
    margin-bottom: 24px;
  }

  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: #a1a1a8;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 3px 10px;
    border-radius: 999px;
    margin-right: 6px;
  }

  .tags { margin-bottom: 32px; }

  .coming-soon {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 24px;
    text-align: center;
    gap: 12px;
  }

  .coming-soon .label {
    font-size: 13px;
    font-weight: 600;
    color: #6b6b75;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .coming-soon .title {
    font-size: 22px;
    font-weight: 700;
    color: #ededed;
    letter-spacing: -0.02em;
  }

  .coming-soon .sub {
    font-size: 14px;
    color: #a1a1a8;
    max-width: 320px;
    line-height: 1.6;
  }

  @media (max-width: 600px) {
    h1 { font-size: 26px; }
    .container { padding: 40px 20px 80px; }
  }

  /* ── Lightbox ── */
  .content img { cursor: zoom-in; }
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 90vw;
    max-height: 88vh;
    border-radius: 10px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    animation: lb-in 0.2s ease;
    cursor: zoom-out;
  }
  @keyframes lb-in {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<div id="lightbox"><img id="lightbox-img" src="" alt=""></div>
<div class="container">

  <a href="../index.html" class="back">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M10 12L6 8l4-4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Back
  </a>

  <div class="meta">
    <span>2025</span>
    <span>Coming soon</span>
  </div>

  <h1>Soft Resolution: A Prediction Market for Subjective Outcomes</h1>

  <div class="tags">
    <span class="tag">Prediction Markets</span>
    <span class="tag">DeFi</span>
    <span class="tag">Solidity</span>
    <span class="tag">Governance</span>
  </div>



  <div style="position:relative;margin-bottom:40px;">
    <img src="images/soft-resolution-header.jpg" alt="Soft Resolution: A Prediction Market for Subjective Outcomes" style="width:100%;display:block;border-radius:12px;">
    <div style="position:absolute;left:0;right:0;top:0;bottom:-2px;background:linear-gradient(to bottom, transparent 40%, hsl(210,11.1%,3.53%) 100%);"></div>
  </div>

  <div class="coming-soon">
    <div class="label">Coming soon</div>
    <div class="title">Article in progress</div>
    <div class="sub">This article is being written. Check back soon or follow me on <a href="https://x.com/megaparsa" target="_blank" style="color:#ededed;text-decoration:underline;text-underline-offset:3px;">X</a> for updates.</div>
  </div>

</div>
<script>
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lightbox-img');
  document.querySelectorAll('.content img').forEach(img => {
    img.addEventListener('click', () => { lbImg.src = img.src; lbImg.alt = img.alt; lb.classList.add('open'); });
  });
  lb.addEventListener('click', () => lb.classList.remove('open'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });
</script>
</body>
</html>
