<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Parsa Amini</title>
<meta name="author" content="Parsa Amini">
<meta name="description" content="Page not found">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: hsl(210, 11.1%, 3.53%);
    color: #ededed;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: #ededed; color: hsl(210,11.1%,3.53%); }

  .wrapper {
    text-align: center;
    padding: 40px 24px;
    max-width: 480px;
  }

  .code {
    font-size: 120px;
    font-weight: 800;
    letter-spacing: -0.05em;
    line-height: 1;
    color: #ededed;
    margin-bottom: 8px;
    position: relative;
    display: inline-block;
  }

  .code::after {
    content: '';
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 3px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    border-radius: 2px;
  }

  .glitch {
    animation: glitch 3s ease-in-out infinite;
  }

  @keyframes glitch {
    0%, 93%, 100% { opacity: 1; transform: translate(0); }
    94% { opacity: 0.8; transform: translate(-2px, 1px); }
    95% { opacity: 0.8; transform: translate(2px, -1px); }
    96% { opacity: 1; transform: translate(0); }
  }

  .title {
    font-size: 20px;
    font-weight: 600;
    color: #a1a1a8;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }

  .desc {
    font-size: 15px;
    color: #6b6b75;
    line-height: 1.65;
    margin-bottom: 36px;
  }

  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: hsl(210, 11.1%, 3.53%);
    background: #ededed;
    padding: 11px 28px;
    border-radius: 10px;
    transition: opacity 0.15s, transform 0.15s;
  }
  .home-btn:hover {
    opacity: 0.88;
    transform: translateY(-1px);
  }
  .home-btn svg {
    width: 15px;
    height: 15px;
  }

  .orbit {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    height: 500px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.03);
    pointer-events: none;
    animation: spin 40s linear infinite;
  }
  .orbit:nth-child(2) {
    width: 700px;
    height: 700px;
    animation-duration: 60s;
    animation-direction: reverse;
  }

  @keyframes spin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(360deg); }
  }

  .dot {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    top: 0;
    left: 50%;
    transform: translateX(-50%);
  }

  @media (max-width: 500px) {
    .code { font-size: 80px; }
    .title { font-size: 17px; }
    .orbit { display: none; }
  }
</style>
</head>
<body>

<div class="orbit"><div class="dot"></div></div>
<div class="orbit"><div class="dot"></div></div>

<div class="wrapper">
  <div class="code glitch">404</div>
  <div class="title">Nothing here</div>
  <div class="desc">This page doesn't exist, was moved, or never made it out of draft.</div>
  <a href="/index.html" class="home-btn">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M10 12L6 8l4-4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Back home
  </a>
</div>

</body>
</html>
