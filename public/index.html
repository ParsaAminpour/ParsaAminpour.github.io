/* ─────────────────── BOTTOM FLOATING NAV (dock-style) ─────────────────── */
const isTouch = () => window.matchMedia('(hover: none)').matches;

const Nav = () => {
  const [mouseX, setMouseX] = React.useState(null);
  const navRef = React.useRef(null);
  const items = [
    { type:'link', href:'#top',     icon:'fa-solid fa-house',       label:'Home' },
    { type:'divider' },
    { type:'link', href:'#about',   icon:'fa-solid fa-user',        label:'About' },
    { type:'link', href:'#work',    icon:'fa-solid fa-briefcase',   label:'Work' },
    { type:'link', href:'#projects',icon:'fa-solid fa-rocket',      label:'Projects' },
    { type:'link', href:'/posts',   icon:'fa-solid fa-feather-pointed',label:'Blog' },
    { type:'link', href:'#contact', icon:'fa-solid fa-envelope',    label:'Contact' },
    { type:'divider' },
    { type:'link', href:'https://github.com/ParsaAminpour', icon:'fa-brands fa-github',    label:'GitHub', external:true },
    { type:'link', href:'https://x.com/megaparsa',           icon:'fa-brands fa-x-twitter', label:'X',       external:true },
  ];

  const handleMove = (e) => {
    if (!isTouch()) setMouseX(e.clientX);
  };
  const handleLeave = () => setMouseX(null);

  return (
    <nav ref={navRef}
      onMouseMove={handleMove}
      onMouseLeave={handleLeave}
      onTouchEnd={handleLeave}
      style={{
        position:'fixed', bottom:'24px', left:'50%', transform:'translateX(-50%)',
        zIndex:50,
        background:'rgba(20,20,22,0.78)',
        backdropFilter:'blur(20px) saturate(180%)',
        WebkitBackdropFilter:'blur(20px) saturate(180%)',
        border:`1px solid rgba(255,255,255,0.08)`,
        borderRadius:'999px',
        padding:'8px 12px',
        display:'flex', gap:'2px', alignItems:'center',
        boxShadow:'0 12px 40px rgba(0,0,0,0.45), 0 2px 10px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.05)',
        height:'58px',
      }}>
      {items.map((item, i) => (
        item.type === 'divider'
          ? <div key={i} style={{width:'1px', height:'24px', background:'rgba(255,255,255,0.12)', margin:'0 6px'}}></div>
          : <DockItem key={i} item={item} navRef={navRef} mouseX={mouseX} />
      ))}
    </nav>
  );
};

const DockItem = ({item, navRef, mouseX}) => {
  const itemRef = React.useRef(null);
  const [hov, setHov] = React.useState(false);

  // Compute distance-based scale (macOS dock magnification)
  let scale = 1;
  if (mouseX !== null && itemRef.current && navRef.current) {
    const r = itemRef.current.getBoundingClientRect();
    const center = r.left + r.width / 2;
    const dist = Math.abs(mouseX - center);
    const maxDist = 80; // px - influence radius
    if (dist < maxDist) {
      const t = 1 - (dist / maxDist);
      scale = 1 + (t * 0.55); // peak ~1.55x
    }
  }

  return (
    <a href={item.href} title={item.label}
      target={item.external?'_blank':undefined} rel={item.external?'noreferrer':undefined}
      ref={itemRef}
      onMouseEnter={()=>{ if (!isTouch()) setHov(true); }}
      onMouseLeave={()=>setHov(false)}
      onTouchEnd={()=>setHov(false)}
      style={{
        width:'40px', height:'40px', borderRadius:'999px',
        display:'flex', alignItems:'center', justifyContent:'center',
        background: scale > 1.15 ? 'rgba(255,255,255,0.10)' : 'transparent',
        color: scale > 1.05 ? '#ffffff' : 'rgba(237,237,237,0.62)',
        fontSize:'15px',
        transform:`scale(${scale}) translateY(${-(scale - 1) * 10}px)`,
        transformOrigin:'center bottom',
        transition:'background 0.15s ease, color 0.15s ease',
        position:'relative',
        flexShrink:0,
      }}>
      <i className={item.icon}></i>
      {hov && (
        <span style={{
          position:'absolute', bottom:'calc(100% + 10px)', left:'50%', transform:'translateX(-50%) scale(' + (1/scale) + ')',
          transformOrigin:'center bottom',
          background:'#ededed', color:'#0f0f10',
          padding:'4px 10px', borderRadius:'6px',
          fontSize:'11px', fontWeight:600, whiteSpace:'nowrap',
          pointerEvents:'none',
          boxShadow:'0 4px 12px rgba(0,0,0,0.4)',
        }}>{item.label}</span>
      )}
    </a>
  );
};

/* ─────────────────── TWEAKS ─────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "bg": "hsl(210,11.1%,3.53%)"
}/*EDITMODE-END*/;

const TweaksPanel = ({visible, tweaks, setTweaks}) => {
  if (!visible) return null;
  const update = (k, v) => {
    const next = {...tweaks, [k]: v};
    setTweaks(next);
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{[k]:v}}, '*');
    if (k === 'bg') document.body.style.background = v;
  };
  const bgOptions = ['#0f0f10','#ffffff','#141416','#0a0a0b','#1a1a1c'];
  return (
    <div style={{position:'fixed', bottom:'20px', right:'20px', zIndex:9999, background:'#fff', border:`1px solid ${C.borderStrong}`, borderRadius:'12px', padding:'18px', width:'220px', fontSize:'12px', boxShadow:'0 12px 32px rgba(0,0,0,0.1)', fontFamily:F.sans}}>
      <div style={{fontWeight:600, marginBottom:'12px', fontSize:'13px', color:C.ink}}>Tweaks</div>
      <div>
        <div style={{color:C.inkMute, marginBottom:'8px', fontWeight:500}}>Background tone</div>
        <div style={{display:'flex', gap:'7px'}}>
          {bgOptions.map(c=>(
            <div key={c} onClick={()=>update('bg',c)}
              style={{width:'26px', height:'26px', borderRadius:'6px', background:c, cursor:'pointer', border: tweaks.bg===c?`2px solid ${C.ink}`:`1px solid ${C.borderStrong}`}}/>
          ))}
        </div>
      </div>
    </div>
  );
};

/* ─────────────────── APP ─────────────────── */
const App = () => {
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = React.useState(false);
  React.useEffect(()=>{
    const handler = e => {
      if (e.data?.type==='__activate_edit_mode')   setTweaksVisible(true);
      if (e.data?.type==='__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return ()=>window.removeEventListener('message', handler);
  },[]);
  React.useEffect(()=>{
    document.body.style.background = tweaks.bg;
  }, []);
  return (
    <>
      <Nav />
      <Hero />
      <About />
      <Work />
      <Skills />
      <Projects />
      <Writing />
      <Contact />
      <Footer />
      <TweaksPanel visible={tweaksVisible} tweaks={tweaks} setTweaks={setTweaks} />
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
